[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
exclude = "(^|/)(venv|\\.venv)/"

[[tool.mypy.overrides]]
module = [
    "language_tool_python",
    "language_tool_python.*",
    "spellchecker",
    "spellchecker.*",
    "celery",
    "celery.*",
    "openpyxl",
    "openpyxl.*",
    "pypdf",
    "pypdf.*"
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
